<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by the value of `flutter build web --base-href`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Moodbow — A journal that learns your story</title>
  <meta name="description" content="Moodbow is a private journal that helps you notice patterns in your mood, sleep and habits over time. Coming soon from BurrowSoft.">
  <link rel="canonical" href="https://moodbow.com/">

  <!-- Open Graph / link previews (Flutter renders to a canvas, so crawlers only see these) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Moodbow">
  <meta property="og:url" content="https://moodbow.com/">
  <meta property="og:title" content="Moodbow — A journal that learns your story">
  <meta property="og:description" content="A private journal that helps you notice patterns in your mood, sleep and habits over time. Coming soon.">
  <meta property="og:image" content="https://moodbow.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Moodbow logo with the text: Coming soon. A journal that learns your story.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Moodbow — A journal that learns your story">
  <meta name="twitter:description" content="A private journal that helps you notice patterns in your mood, sleep and habits over time. Coming soon.">
  <meta name="twitter:image" content="https://moodbow.com/og-image.png">

  <meta name="theme-color" content="#FBF6F1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2B2438" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <!-- Icons -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-title" content="Moodbow">

  <style>
    html, body { margin: 0; height: 100%; background: #FBF6F1; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #2B2438; }
    }
    /* Shown until Flutter paints its first frame, so the page is never blank. */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: inherit;
      transition: opacity 200ms ease-out;
    }
    #splash svg { width: 96px; height: auto; }
    #splash.hidden { opacity: 0; pointer-events: none; }
    @media (prefers-reduced-motion: reduce) {
      #splash { transition: none; }
    }
    noscript { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .noscript {
      position: relative;
      z-index: 20;
      max-width: 560px;
      margin: 0 auto;
      padding: 20vh 24px 48px;
      text-align: center;
      color: #2B2438;
      line-height: 1.6;
    }
    .noscript h1 { font-size: 28px; font-weight: 500; margin: 0 0 12px; }
    .noscript p { color: #6B6278; margin: 0 0 16px; }
    .noscript a { color: #A8456A; }
    @media (prefers-color-scheme: dark) {
      .noscript { color: #FBF6F1; }
      .noscript p { color: #C9C1D4; }
      .noscript a { color: #E27D9A; }
    }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 404 274"><g transform="translate(20,20) scale(2.0) translate(-19,-24)" fill="none" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"><path d="M30 130V75A40 40 0 0 1 110 75" stroke="#F2A07B"/><path d="M110 75A40 40 0 0 1 190 75V130" stroke="#9B84D6"/><path d="M110 75V130" stroke="#E27D9A"/></g></svg>
  </div>

  <noscript>
    <div class="noscript">
      <h1>A journal that learns your story.</h1>
      <p>Moodbow is a private journal that helps you notice patterns in your mood, sleep and habits over time. We're putting the finishing touches on it.</p>
      <p>Coming soon. To be notified when it launches, email
        <a href="mailto:support@burrowsoft.com?subject=Notify%20me%20about%20Moodbow">support@burrowsoft.com</a>.</p>
      <p>A <a href="https://www.burrowsoft.com">BurrowSoft</a> product · © 2026 BurrowSoft</p>
    </div>
  </noscript>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('hidden');
      setTimeout(function () { splash.remove(); }, 250);
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
