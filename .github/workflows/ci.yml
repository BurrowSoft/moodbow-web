name: CI

on:
  pull_request:
  push:
    branches: [master]
  # All the journeys, on master, at a quiet hour, so a break in the real sign-up form isn't left for
  # the next PR that touches it. A red run shows in the Actions list.
  schedule:
    - cron: "17 19 * * *"
  # The same daily run, started by hand (publish day's morning, UX): GitHub started the cron
  # 3.5 h late on 8 Nov. Master only; it runs exactly what the schedule runs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs share a group per branch, so a new push cancels the superseded
  # run. master runs are grouped per commit so queued merges aren't dropped.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, lint and unit tests
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes, so don't leave a token in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `next typegen && tsc --noEmit`: route types first, so tsc checks the
      # same things `next build` does.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  e2e:
    name: Build and Playwright smoke
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Playwright's own image, the exact version in package-lock.json: Chromium and its
    # system packages are already in it, so no apt step can stall or fail (security.ubuntu.com
    # didn't resolve on any runner for hours on 11 Nov). Bump it with @playwright/test.
    # As the runner's own user (1001), Playwright's advice: as root, Next's SWC refused
    # its cache in /github/home, which that user owns.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Gated pages fail closed (404) unless the build is explicitly a test
      # build; the smoke tests check the drafts, so opt in. No Sentry DSN, so
      # Sentry stays off.
      - run: npm run build
        env:
          NEXT_PUBLIC_SHOW_DRAFTS: "1"
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The launch journeys (e2e/journey): sign-up to delete account against
  # STAGING, with throwaway @example.invalid accounts. Its own build, pointed
  # at staging (the smoke job's build has no Supabase on purpose). PR runs
  # only: the job is skipped on pushes to master, and the trigger is
  # pull_request, never pull_request_target, so fork PRs get no secrets. The
  # secrets reach only the steps below that need them, the secret key only the
  # test step (never the build), and nothing prints them.
  # Without the secrets every step after the check is skipped. They're the
  # "staging" environment's secrets (VITOR.md item 4), which a job sees only
  # when it names that environment.
  journeys:
    name: Staging journeys
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    environment: staging
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    # As the smoke job: Playwright's own image, so there's no browser install at all.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001
    timeout-minutes: 20
    steps:
      - id: cfg
        env:
          URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SECRET: ${{ secrets.SUPABASE_STAGING_SECRET_KEY }}
          PUBLISHABLE: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ] || [ -z "$PUBLISHABLE" ]; then
            echo "Staging secrets not set: journeys skipped."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ "$(node -e 'console.log(new URL(process.env.URL).hostname)')" != "mnmkkrqponzlenvxiutd.supabase.co" ]; then
            echo "::error::SUPABASE_STAGING_URL isn't the staging project: refusing."
            exit 1
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cfg.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.cfg.outputs.ok == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - if: steps.cfg.outputs.ok == 'true'
        run: npm ci
      - if: steps.cfg.outputs.ok == 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_SHOW_DRAFTS: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
      # The journeys that send a real email (@real-email) run only where sign-up changes: staging
      # limits those emails, and a heavy day failed every PR. The help numbers (@help-numbers, minutes
      # of page loads) run only where the numbers or the card change. If the list can't be read, all
      # run. The daily run, by schedule or by hand, is everything.
      - id: scope
        if: steps.cfg.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The PR's files from the API with Node (the Playwright image has no gh), every page of 100.
          files=$(node -e '
            const [repo, pr] = process.argv.slice(1);
            (async () => {
              const names = [];
              for (let page = 1; ; page++) {
                const res = await fetch(`https://api.github.com/repos/${repo}/pulls/${pr}/files?per_page=100&page=${page}`, {
                  headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: "application/vnd.github+json" },
                });
                if (!res.ok) process.exit(1);
                const batch = await res.json();
                names.push(...batch.map((f) => f.filename));
                if (batch.length < 100) break;
              }
              console.log(names.join("\n"));
            })().catch(() => process.exit(1));
          ' "${{ github.repository }}" "${{ github.event.number }}") || files=
          if [ -z "$files" ] || echo "$files" | grep -qE '^(src/app/\[locale\]/(sign-up|consent|welcome|email-confirmed|auth)/|src/lib/(legalVersions|onboardingConsent|authErrors)|src/lib/supabase/|src/lib/(email|password)|src/components/AuthField|src/proxy\.ts|src/i18n/|src/messages/|content/conditions\.json|next\.config\.ts|package(-lock)?\.json|e2e/journey/|\.github/workflows/)'; then
            skip=
          else
            skip=@real-email
          fi
          if [ -n "$files" ] && ! echo "$files" | grep -qE '^(content/contracts/countries\.json|src/lib/safety/helplines|src/components/(SafetyCard|Dialog)|src/messages/|e2e/journey/|\.github/workflows/)'; then
            skip="${skip:+$skip|}@help-numbers"
          fi
          if [ -n "$skip" ]; then
            echo "args=--grep-invert '$skip'" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cfg.outputs.ok == 'true'
        run: npm run test:journeys -- --grep "session revoked mid-visit" --repeat-each=20
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
          SUPABASE_STAGING_SECRET_KEY: ${{ secrets.SUPABASE_STAGING_SECRET_KEY }}
      # Traces and screenshots only: the journey writes no secrets into them,
      # but the report holds the throwaway emails, so it's kept for 3 days.
      - if: failure() && steps.cfg.outputs.ok == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: journeys-report
          path: |
            playwright-report/
            test-results/
          retention-days: 3
